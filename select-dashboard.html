<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Select Dashboard | Circuitech</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;color:#eef3fb;font-family:Arial,sans-serif;padding:24px}
main{width:min(620px,100%);background:#182235;border:1px solid #34445d;border-radius:18px;padding:28px}
h1{margin-top:0}p{color:#aab8cc;line-height:1.5}.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px}
button{padding:18px;border-radius:12px;border:1px solid #465b79;background:#202f46;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:hover{border-color:#ff9d00;background:#293c58}#message{margin-top:18px;color:#ffbd63}
</style></head>
<body><main>
<h1>Select your dashboard</h1>
<p>Your account has more than one assigned role. Choose the workspace you want to open.</p>
<div class="roles" id="roles"><p>Verifying your access…</p></div><p id="message"></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script>
(async function(){
 const root=document.getElementById('roles'), msg=document.getElementById('message');
 try{
  const auth=window.FirebaseServices.auth;
  const user=auth.currentUser || await new Promise(resolve=>{
   const unsub=auth.onAuthStateChanged(u=>{unsub();resolve(u)});
  });
  if(!user){location.replace('login.html?restricted=1');return;}
  const profile=await window.FirebaseServices.getCurrentProfile();
  const roles=window.FirebaseServices.normalizeRoles(profile);
  if(!profile || String(profile.status).toLowerCase()!=='active' || !roles.length){
   location.replace('pending-approval.html');return;
  }
  root.innerHTML='';
  const labels={client:'Client Dashboard',admin:'Admin Dashboard',engineer:'Engineer Dashboard'};
  for(const role of roles){
   const b=document.createElement('button');b.textContent=labels[role];
   b.addEventListener('click',async()=>{
    try{const page=await window.FirebaseServices.selectDashboard(role);location.href=page;}
    catch(e){msg.textContent=e.message;}
   });
   root.appendChild(b);
  }
 }catch(e){console.error(e);msg.textContent='Could not verify roles. Check Firestore rules and try again.';}
})();
</script></body></html>
